# 光魂官网 · Nginx 反向代理（HTTP 阶段模板）
# ============================================
# 用法：复制到 /etc/nginx/sites-available/website.conf，
#      软链到 sites-enabled，删除默认站点后 `nginx -t && systemctl reload nginx`。
#      把 xxrsm.com 换成实际域名。
# 证书：DNS 指向本机后执行
#      sudo bash deploy/enable-https.sh --domain xxrsm.com --email ops@xxrsm.com
#      脚本会调用 certbot --nginx 自动写入 443 与 80→443 跳转，
#      并同步 .env 的 SITE_ORIGIN / COOKIE_SECURE / TRUST_PROXY，失败自动回滚。
# 手工方式：
#      certbot --nginx -d xxrsm.com -d www.xxrsm.com --redirect
#      并把 .env 改为 SITE_ORIGIN=https://xxrsm.com、COOKIE_SECURE=1、TRUST_PROXY=1

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name xxrsm.com www.xxrsm.com _;

    # 与后端上传上限对齐（单次 ≤12MB；更大的文件由前端分片上传，每片 5MB）
    client_max_body_size 12m;

    # 大文件下载不落磁盘缓冲，保证断点续传与低延迟
    proxy_buffering off;
    proxy_request_buffering off;

    # 素材库 / 下载文件由 Nginx 直接读磁盘（不进 Node 进程）
    # 文件名带时间戳与随机串，正常不会覆盖；replace 复用同名文件时缓存最多滞后 1 小时。
    location /uploads/ {
        alias /opt/website/data/uploads/;
        sendfile on;
        tcp_nopush on;
        autoindex off;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff;
    }

    # 不对外暴露隐藏文件（如上传临时文件）
    location ~ /uploads/\. {
        deny all;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
