# 光魂官网 · Nginx 反向代理（HTTP 阶段模板）
# ============================================
# 用法：复制到 /etc/nginx/sites-available/website.conf，
#      软链到 sites-enabled，删除默认站点后 `nginx -t && systemctl reload nginx`。
# 证书：DNS 指向本机后执行
#      certbot --nginx -d xxrsm.com -d www.xxrsm.com --redirect
#      certbot 会自动在本文件写入 443 与续期配置。
# 切换 HTTPS 后同步修改 /opt/website/app/.env：
#      SITE_ORIGIN=https://xxrsm.com
#      COOKIE_SECURE=1
#      TRUST_PROXY=1

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name xxrsm.com www.xxrsm.com _;

    # 与后端上传上限对齐（图片 10MB，留出 multipart 余量）
    client_max_body_size 12m;

    # 大文件下载不落磁盘缓冲，保证断点续传与低延迟
    proxy_buffering off;
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
