# Render 蓝图：从 GitHub 仓库一键部署「光魂官网」（前端 + API 同源）
# 用法：Render → New → Blueprint → 选择本仓库 → Apply
services:
  - type: web
    name: guanghun-site
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # 前端产物由 Express 同源托管（Dockerfile 内已构建）
      - key: STATIC_DIR
        value: /app/gh-web/dist
      # 生产安全：Dockerfile 已默认以 VITE_ADMIN_AUTO_LOGIN=off 构建（进 /admin 必须登录）。
      # 若确需「免登录」演示：在 Render 的 Docker 构建参数里设 VITE_ADMIN_AUTO_LOGIN=on 后重新部署。
      # 首次建库时的后台口令（仅表为空时生效）：
      #   - key: ADMIN_PASSWORD
      #     value: <改成你的强口令>
      #   - key: ADMIN_OPERATOR_PASSWORD
      #     value: <改成你的强口令>
